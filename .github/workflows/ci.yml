name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python3 run.py lint

      - name: Unit tests
        run: python3 run.py test

      - name: Labs
        run: python3 run.py labs

      - name: Capstone evals
        run: python3 run.py capstone
